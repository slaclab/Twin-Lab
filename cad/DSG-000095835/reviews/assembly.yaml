notes:
- Offline provisional kinematic model; CAD pose is q=0 for every joint.
- Axes and attachment order inferred from bearing geometry and coincident mounting
  planes.
- Catalog travel is exposed for review; imported Parker and Kohzu absolute travel
  zeros are uncalibrated.
- Kohzu RA/SA and Huber fused solids are partitioned at visible moving interfaces;
  internal bearings simplified.
- Jet stage leaves P018/P019/P020 are empty in the supplied STEP; available jet parts
  remain fixed.
- Manual stages remain fixed. Diffractometer, beam construction geometry and communication
  configuration omitted.
- Split outputs discard inverted and disconnected solids below 100 cubic millimetres;
  external stage bodies and carriage interfaces retained.
- LJ auxiliary motors disabled at user request; their parts remain fixed obstacles.
- Outer cage A047 is fixed collision geometry. Large spectrometer controls are the
  two 100 mm Parker slides.
- Top electronics P1221 and its rigid supports ride the Parker lift plate P920;
  retain them for visual and interference checking. The flexible cable chain is omitted.
