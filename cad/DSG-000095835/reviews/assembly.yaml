notes:
- Offline provisional kinematic model; CAD pose is q=0 for every joint.
- Axes and attachment order inferred from bearing geometry and coincident mounting planes.
- Catalog travel is exposed for review; imported Parker and Kohzu absolute travel zeros are
  uncalibrated.
- Kohzu RA/SA and Huber fused solids are partitioned at visible moving interfaces; internal
  bearings simplified.
- Jet stage parts are present in this STEP revision and remain fixed.
- Manual stages remain fixed. Diffractometer, beam construction geometry and communication
  configuration omitted.
- Split outputs discard inverted and disconnected solids below 100 cubic millimetres; external
  stage bodies and carriage interfaces retained.
- LJ auxiliary motors disabled at user request; their parts remain fixed obstacles.
- Outer cage A047 is fixed collision geometry. Large spectrometer controls are the two 100
  mm Parker slides.
- The user-supplied controls envelope P867 and its support posts ride the Parker lift plate
  P831; this STEP revision replaces the earlier XCS Von Hamos Controls assembly DSG-000108873
  with that single envelope.
- The supplied STEP is the 10 degree mounting configuration of DSG-000095826 on DSG-000097481.
  The 0 and 5 degree mounting placements are not yet verified.
- Detector assembly LCL5005-008450 (ePix10k on two Newport IMS300 slides) is fixed obstacle
  geometry; its 45 parts at least 100 mm across are retained and smaller parts and electronics
  are omitted. Its slides are not modelled as joints.
- Table assembly DSG-000008836 (understructure, floor anchors, diffractometer) stays omitted.
