source_step: cad/DSG-000095835/source.stp
source_sha256: b1c34cc1ddab5fa5db03b531fea010e15f8e73646cb32b8fcfcde00f2d6f4da4
cad_manifest: cad/DSG-000095835/manifest.json
linear_deflection_mm: 0.5
# Visual meshes use the STEP presentation colours, face by face (STEP carries no image
# textures). visual_rgba is the fallback for leaves the STEP leaves uncoloured.
visual_colors: step
visual_rgba: [0.7, 0.7, 0.7, 1.0]
split_templates: stage-splits.yaml
collision_regressions:
- name: CAD home is clear
  positions: {}
  expect_clear: true
- name: Vertical lift contacts the outer cage
  positions:
    parker_lift_joint: -0.05
  touching_pairs: [[P526, P702]]
- name: Return from cage contact to home
  positions: {}
  expect_clear: true
# Reviewed hull false positives that cannot close within travel. The convex hulls of chamber
# port P403 fill the bores the slit blade rods pass through; source CAD keeps clearance around
# each rod at every corner of its +/-4 mm y and +/-7.5 mm x travel.
ignored_pairs:
- pair: [P403, P077]
  reason: Bottom slit rod passes through the port bore with >= 2.786 mm CAD clearance over travel.
- pair: [P403, P123]
  reason: Top slit rod passes through the port bore with >= 2.729 mm CAD clearance over travel.
notes:
- Offline provisional kinematic model; CAD pose is q=0 for every joint.
- Axes and attachment order inferred from bearing geometry and coincident mounting planes.
- Catalog travel is exposed for review; imported Parker and Kohzu absolute travel zeros are uncalibrated.
- Kohzu XA/SA and Huber fused solids are partitioned at visible moving interfaces; internal bearings
  simplified.
- Bearing parts also list payloads riding a constant designed clearance to their own stage, which
  the inflated hulls fill. These are Huber end plate P936 (0.5 mm over +/-45 degrees), Parker
  bracket P698 (3.25 mm over +/-50 mm), slit lift brackets P091/P140 (0.787 mm over +/-4 mm) and
  slit X-stage sensor brackets P106/P155 (0.498 mm to the X carriage over +/-7.5 mm). Source-CAD
  gaps were checked across the full travel.
- The four crystal rotation stages LIB-000032444 (P767/P811/P854/P897) replaced the Kohzu RA04A-W
  in this revision and carry no solids in the STEP, so no rotation stage is drawn or checked. Each
  rotation axis rides the adapter mo39185433 above it, which kept its place in the stack; the XA07A
  translation stages sit 0.5 mm higher in each stack than before.
- The STEP holds four mo39154771 crystal stacks A064-A067. Stack 4 joint frames are stack 1 frames
  carried by the stack placement transform; the same transform reproduces stacks 2 and 3 to 0.022 mm.
- Jet stage parts are present in this STEP revision.
- Manual stages remain fixed, except the ePix100's manual Kohzu translation and swivel. Beam
  construction geometry and communication configuration omitted.
- Analyzer (Huber 410) and crystal rotations are limited to +/-45 degrees about the CAD pose by
  request.
- Split outputs discard inverted and disconnected solids below 100 cubic millimetres; external stage
  bodies and carriage interfaces retained.
- Beamline axes, used to name the LJ, slit and detector joints, are y up (world +Z) and beam travelling
  along -z (world -Y), so z is world +Y and x is world -X. The beam direction is inferred from the
  slits upstream at world +Y and the ePix10k centred on world Y downstream.
- Liquid jet DSG-000007948 is a three-axis chain, as in the 43841 review. Kohzu XA05A-L202-R A007
  runs along the jet (x, 50 mm), XA05A-R202 A006 carries z (15 mm), then the ZA05A lift A005 carries
  y (+/-4 mm). The lift is at mid-travel in this STEP. Its carriage sits at the library's zero
  offset on its base, as both slit lifts do, and drops more than 5 mm before bottoming. The older
  43841 STEP drew every LIB-000032469 carriage 3.105 mm lower, so that review modelled the jet lift
  as fully down. The jet adapter DSG-000000506 P011, holder DSG-000108486 P507 and
  tube DSG-000005121 P514 ride the lift. The long jet DSG-000022427 left the design in the
  2026-11-04 revision.
- Bottom and top slits A009/A015 each stack a LIB-000032451 vertical lift (y, 8 mm) under an XA05A-R202
  (x, 15 mm); the blade rods ride the X stage. See auxiliary-stages.md.
- The slit blade holders DSG-000000720 (P497 bottom, P194 top) and their blade plates (P424/P425 bottom,
  P422/P423 top) are placed directly under chamber assembly A003 in the STEP, but are clamped by four
  5-40 screws to the tip of each blade rod (P077, P123). They ride the slit X stages.
- The ePix10k detector rides two Newport IMS300CC slides, the lower P1791 along z and the upper P1723
  along x. Each fused slide is split at its carriage, and 300 mm travel is assumed centred on the
  carriage position the fused slide models. In the 2026-11-04 STEP everything on the lower carriage
  sits 80.1151 mm along world -Y from that carriage, so its moving region is offset to sit under
  the payload and z travel is -69.885/+230.115 mm about the CAD pose.
- Outer cage A035 is fixed collision geometry. Large spectrometer controls are the two 100 mm Parker
  slides.
- The user-supplied controls envelope P702 and its support posts ride the Parker lift plate P666;
  this STEP revision replaces the earlier XCS Von Hamos Controls assembly DSG-000108873 with that
  single envelope.
- The supplied STEP is the 10 degree mounting configuration of DSG-000095826 on DSG-000097481. The
  0 and 5 degree mounting placements are not yet verified.
- Detector assembly LCL5005-008450 (ePix10k on two Newport IMS300 slides) keeps its parts at least
  100 mm across, including front plate mo39134025 P1342; smaller parts and electronics are omitted.
- Diffractometer base P973 is fixed geometry. The diffractometer body, 2-theta arm and 2-theta stage
  (P974-P976) carry only coordinate systems in this STEP, so no further diffractometer geometry can
  be shown; its goniometer SA-391-444-50 is not in the export. The rest of table assembly
  DSG-000008836 (understructure, floor anchors) stays omitted.
- Camera stages LIB-000032933/LIB-000032929 have no geometry in this STEP; the camera stays fixed.
- The upward-facing ePix100 (module mo39154223 in DSG-000042618 A021) rides, from the fixed column
  P302/P328/P202, a lead-screw linear stage LIB-000000725 P197 along world X, an old 70 mm manual
  Kohzu cross-roller X stage LIB-000005430 P313 along world Y, and a Kohzu SH05B-RM manual swivel
  LIB-000013709 A031 about world X through datum sphere P326. A 10 degree wedge adapter P196 under
  the swivel gives the detector's CAD tilt; the swivel itself is centred. Both stages are fused
  single solids in the STEP and are split at their carriage/table (stage-splits.yaml). The linear
  stage travel comes from its end blocks, -92.2/+101.7 mm for the fused carriage; the payload sits
  61.19 mm from that carriage in this STEP, so its moving region is offset and ePix100 x runs
  -40.51/+153.39 mm about the CAD pose. The Kohzu travel is the +/-6.5 mm of the current XM07A
  equivalent. The module's front/rear covers P266/P222 and cooling block P249/P250 have solids since
  the 2026-11-04 14:01 export (empty before), so they are retained with the external coolant fittings
  and tubes P251-P258/P288 and the transceiver P240 and ribbon cable P247 that protrude from the
  rear face; the parts fully enclosed by the covers stay omitted as internals.
