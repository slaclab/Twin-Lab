cad_manifest: cad/DSG-000095835/manifest.json
linear_deflection_mm: 0.5
# Visual meshes use the STEP presentation colours, face by face (STEP carries no image
# textures). visual_rgba is the fallback for leaves the STEP leaves uncoloured.
visual_colors: step
visual_rgba: [0.7, 0.7, 0.7, 1.0]
# Red and yellow are the clearance viewer's interference and near-clearance highlights, so
# saturated STEP paint in those hues (the ePix10k housing mo39134050, the Thorlabs posts,
# brass thumb nuts) is drawn white instead, keeping its transparency. Oranges and tans
# (18-38 degrees) are left alone.
visual_reserved_hues:
- hue_deg: [-12, 12]
  rgba: [0.95, 0.95, 0.95, 1.0]
- hue_deg: [40, 65]
  rgba: [0.95, 0.95, 0.95, 1.0]
# Whole leaves painted to their real finish, by CAD name without the _oa_ suffix. The
# ePix10k ring set (mo39152641) and its back plate REF-000076019 are black anodized; the
# STEP draws them translucent yellow and olive. The ePix10k2M sensor chips are drawn
# silicon blue, seen through the shield window mo39134050, which is smoked grey so it
# stays visible over them without the red the STEP gives it.
visual_part_rgba:
  REF__sa39152641__Epix10k_FrontRing: [0.08, 0.08, 0.08, 1.0]
  REF__sa39152641__Epix10k_BackRing: [0.08, 0.08, 0.08, 1.0]
  REF__sa39152641__Epix10k_MountingRib: [0.08, 0.08, 0.08, 1.0]
  mo39152625: [0.08, 0.08, 0.08, 1.0]
  REF-000076019: [0.08, 0.08, 0.08, 1.0]
  REF__mo39152608__DetectorChip: [0.15, 0.35, 0.9, 1.0]
  mo39134050: [0.3, 0.32, 0.35, 0.4]
split_templates: stage-splits.yaml
collision_regressions:
# The 2026-11-12 STEP put the ePix10k frame and plate 2.3 mm into chamber part REF-000062451
# (DSG-000000413) at home. The 2026-11-21 STEP raises the ePix10k payload 61.67 mm relative to
# the chamber, and home is clear again.
- name: CAD home is clear
  positions: {}
  expect_clear: true
- name: Vertical lift contacts the outer cage
  positions:
    parker_lift_joint: -0.05
  touching_pairs: [[P534, P702]]
- name: Return from cage contact to home
  positions: {}
  expect_clear: true
# The ZA16A wedge follows ePix10k y, sliding 32 mm forward at the top.
- name: ePix10k y top, wedge slid forward
  positions:
    detector_y_joint: 0.008
  expect_clear: true
- name: ePix10k y bottom, wedge drawn back
  positions:
    detector_y_joint: -0.008
  expect_clear: true
# Reviewed hull false positives that cannot close within travel. The convex hulls of chamber
# port P414 fill the bores the slit blade rods pass through; source CAD keeps clearance around
# each rod at every corner of its +/-4 mm y and +/-7.5 mm x travel.
ignored_pairs:
- pair: [P414, P078]
  reason: Bottom slit rod passes through the port bore with >= 2.786 mm CAD clearance over travel.
- pair: [P414, P124]
  reason: Top slit rod passes through the port bore with >= 2.729 mm CAD clearance over travel.
- pair: [P2147, P2146]
  reason: The ZA16A table and wedge are sibling bodies coupled by detector_y_wedge_joint; their 1/4
    incline faces stay in contact, without overlap, at every height, so no Drake joint filter
    covers this always-touching bearing.
- pair: [P2147, P2145]
  reason: The ZA16A wedge's retainer P2145 rides the same 1/4 incline under the table, touching it
    without overlap at every height.
- pair: [P2146, P2054]
  reason: ePix10k frame P2054 clears the ZA16A wedge by 9.297 mm at home and 1.297 mm at the bottom
    of +/-8 mm y travel, measured in CAD with the wedge sliding 4 mm per mm (2 mm steps).
- pair: [P2145, P2054]
  reason: ePix10k frame P2054 clears the wedge retainer by the same 9.297/1.297 mm as the wedge.
# Mechanisms whose own drawn clearances are not faithful: every pair within a group is ignored,
# while each member stays checked against the rest of the assembly.
ignored_groups:
- parts: [P323, P324, P325, P326, P327, P328, P329, P330, P331, P332, P333, P334, P335, P336]
  reason: Newport M-EL80 lab jack LIB-000033108. Its pins stay seated over Newport's 53-113 mm, but
    the library CAD is drawn tighter than the real jack. At 112.2 mm the arms' sliding
    ends already cut 1.5 mm (36.5 mm3) into the plates' channels. Below 72.8 mm arm B sweeps into
    the top plate's underside beside its pivot, and the top block meets its channel end at 60.0 mm.
notes:
- Offline provisional kinematic model; CAD pose is q=0 for every joint.
- Axes and attachment order inferred from bearing geometry and coincident mounting planes.
- Catalog travel is exposed for review; imported Parker and Kohzu absolute travel zeros are uncalibrated.
- Kohzu XA/SA and Huber fused solids are partitioned at visible moving interfaces; internal bearings
  simplified.
- Bearing parts also list payloads riding a constant designed clearance to their own stage, which
  the inflated hulls fill. These are Huber end plate P936 (0.5 mm over +/-45 degrees), Parker
  bracket P698 (3.25 mm over +/-50 mm), slit lift brackets P092/P141 (0.787 mm over +/-4 mm) and
  slit X-stage sensor brackets P107/P156 (0.498 mm to the X carriage over +/-7.5 mm). Source-CAD
  gaps were checked across the full travel.
- The four crystal rotation stages LIB-000032444 (P767/P811/P854/P897) replaced the Kohzu RA04A-W
  in this revision and carry no solids in the STEP, so no rotation stage is drawn or checked. Each
  rotation axis rides the adapter mo39185433 above it, which kept its place in the stack; the XA07A
  translation stages sit 0.5 mm higher in each stack than before.
- The STEP holds four mo39154771 crystal stacks A068-A071. Stack 4 joint frames are stack 1 frames
  carried by the stack placement transform; the same transform reproduces stacks 2 and 3 to 0.022 mm.
- Jet stage parts are present in this STEP revision.
- Manual stages remain fixed, except the ePix100's M-EL80 lab jack, manual Kohzu translation and
  swivel. Beam construction geometry and communication configuration omitted.
- Analyzer (Huber 410) and crystal rotations are limited to +/-45 degrees about the CAD pose by
  request.
- Split outputs discard inverted and disconnected solids below 100 cubic millimetres; external stage
  bodies and carriage interfaces retained.
- Beamline axes, used to name the LJ, slit and detector joints, are y up (world +Z) and beam travelling
  along -z (world -Y), so z is world +Y and x is world -X. The beam direction is inferred from the
  slits upstream at world +Y and the ePix10k centred on world Y downstream.
- Liquid jet DSG-000007948 is a three-axis chain, as in the 43841 review. Kohzu XA05A-L202-R A007
  runs along the jet (x, 50 mm), XA05A-R202 A006 carries z (15 mm), then the ZA05A lift A005 carries
  y (+/-4 mm). The lift is at mid-travel in this STEP. Its carriage sits at the library's zero
  offset on its base, as both slit lifts do, and drops more than 5 mm before bottoming. The older
  43841 STEP drew every LIB-000032469 carriage 3.105 mm lower, so that review modelled the jet lift
  as fully down. The jet adapter DSG-000000506 P011 carries jet holder DSG-000108486 P520, which
  holds tube DSG-000005121 P521; both ride the lift, as in the 2026-11-04 14:01 review. The long jet
  DSG-000022427 that the 2026-11-12 export carried in their place is not in this export.
- Bottom and top slits A009/A015 each stack a LIB-000032451 vertical lift (y, 8 mm) under an XA05A-R202
  (x, 15 mm); the blade rods ride the X stage. See auxiliary-stages.md.
- The slit blade holders DSG-000000720 (P511 bottom, P195 top) and their blade plates (P436 bottom,
  P434/P435 top) are placed directly under chamber assembly A003 in the STEP, but are clamped by four
  5-40 screws to the tip of each blade rod (P078, P124). They ride the slit X stages. The bottom
  holder's second plate mo39143620 is not in this export.
- The ePix10k detector rides two Newport IMS300CC slides, now multi-part library models
  LIB-000033136, the lower A160 (base P2148, carriage P2149) along z and the upper A161 (base P2150,
  carriage P2151) along x. Each base's carriage channel is open from 0 to 513.5 mm along its travel
  and the library places its 179 mm carriage at 167 mm, mid-channel, which is taken as mid-travel
  for the 300 mm stroke. The upper carriage is drawn there, so x runs +/-150 mm. The lower carriage
  is drawn 134.378 mm towards world +Y, so z runs -284.378/+15.622 mm. Above the upper carriage's
  adapter P2102, a Kohzu ZA16A-W2C01 wedge Z stage LIB-000033137 A157 lifts the detector along
  world +Z (y, +/-8 mm). Its table P2147 rides with everything above it from frame P2054 up, and
  its 1/4 wedge P2146 with retainer P2145 slides under the table 4 mm along world +Y per mm of
  lift (detector_y_wedge_joint follows detector_y_joint), its incline faces in contact with the
  table's at every height. The base P2144 and its pin P2143 stay on the x slide. The vendor drawing
  gives the table 80 +/-8 mm above the mounting face, and the CAD table face sits at 80.01 mm, so
  the CAD pose is mid-travel. The plates DSG-000007302 (P2090, P2118) now hang under the fixed
  base plate P2124, and the lower base P2148 stands on its risers P2097/P2120.
- Outer cage A040 is fixed collision geometry. Large spectrometer controls are the two 100 mm Parker
  slides.
- The user-supplied controls envelope P702 and its support posts ride the Parker lift plate P666;
  this STEP revision replaces the earlier XCS Von Hamos Controls assembly DSG-000108873 with that
  single envelope.
- The supplied STEP is the 10 degree mounting configuration of DSG-000095826 on DSG-000097481. It
  also holds a 0 degree copy A075 and a solid-less 5 degree placement P523, omitted here; their
  placements give the alternative mountings exactly.
- Detector assembly LCL5005-008450 (ePix10k on two Newport IMS300 slides) keeps its parts at least
  100 mm across; smaller parts and electronics are omitted. The front plate mo39134025 is not in
  this export.
- Diffractometer base P973 is fixed geometry. The diffractometer body, 2-theta arm and 2-theta stage
  (P974-P976) carry only coordinate systems in this STEP, so no further diffractometer geometry can
  be shown; its goniometer SA-391-444-50 is not in the export. The rest of table assembly
  DSG-000008836 (understructure, floor anchors) stays omitted.
- Camera rotation stage LIB-000032933 (P471 base, P472 top) has geometry since the 2026-11-12 export
  and is held fixed with the camera mount; LIB-000032929 still has no solids.
- The upward-facing ePix100 (module mo39154223 in DSG-000042618 A021) rides, from the fixed block
  P204, a manual Newport M-EL80 lab jack LIB-000033108 A033 along world +Z (y), a Micronix
  VT-50L-13316 stepper stage LIB-000033066 A023 along world X, a manual stage LIB-000033109 A034 along
  world Y, and a Kohzu SH05B-RM manual swivel LIB-000013709 A022 about world X through datum sphere
  P221, where the swivel base's guideway arcs are centred. Its top plate's arcs sit 0.30 mm lower, a
  small mating offset in the CAD left as drawn. A 10 degree wedge adapter P197 under the swivel gives
  the detector's CAD tilt; the swivel itself is centred. The module's front/rear covers P287/P243
  and cooling block P270/P271 are retained with the external coolant fittings and tubes
  P272-P279/P309 and the transceiver P261 and ribbon cable P268 that protrude from the rear face; the
  parts fully enclosed by the covers stay omitted as internals.
- The M-EL80 is a single scissor drawn 83.00 mm high, mid-way through its 53-113 mm range, and
  turned 180 degrees about world Z from the 2026-11-12 export. Arm A P325 pins to the base plate
  P324 at (x -129.231, z -217.074) mm and slides on top block P328; arm B P326 pins to the top plate
  P323 at z -160.174 and slides on bottom block P329; they cross at centre pin P330. The arms are
  103.581 mm between pivots, at 33.33 degrees. Knob and screw P327 ride the top plate and drive
  P328 as a nut. epix100_y_joint lifts the top plate; the arms and blocks follow it by the exact
  scissor relation. ePix100 y covers Newport's full 53-113 mm, -30.000/+30.000 mm about the CAD
  pose, as the user asked. The library CAD is drawn tighter than the real jack (see
  ignored_groups), so its own parts visibly overlap low in the stroke.
- The VT-50L-13316 is Micronix's 198 mm version. Its carriage P224 runs 175.5 mm towards the motor,
  where its nut housing meets the motor mount, and 28.0 mm to the far end block, 203.5 mm in all. The
  198 mm between its limit switches is assumed centred in that, so the carriage is drawn 73.8 mm
  from mid-travel and ePix100 x runs -25.22/+172.78 mm along beamline x (world -X).
- The manual stage LIB-000033109 (base P340, table P341, micrometer P342 along world +Y) replaces
  the earlier fused Kohzu model; its CAD has no end stops, so it keeps that stage's +/-6.5 mm.
