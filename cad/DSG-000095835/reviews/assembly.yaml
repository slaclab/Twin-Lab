model_name: DSG-000095835
source_step: cad/DSG-000095835/source.stp
source_sha256: 2f9a4891e5db4720656e05825dc29b1bed52faa54baa20a5c7ab5d47e915338e
cad_manifest: cad/DSG-000095835/manifest.json
linear_deflection_mm: 0.5
# Visual meshes use the STEP presentation colours, face by face (STEP carries no image
# textures). visual_rgba is the fallback for leaves the STEP leaves uncoloured.
visual_colors: step
visual_rgba: [0.7, 0.7, 0.7, 1.0]
split_templates: stage-splits.yaml
collision_regressions:
# In the 2026-11-12 STEP everything outside chamber assembly DSG-000102548 sits 67.818 mm lower
# than in the 14:01 STEP. That puts the ePix10k frame P1751 and plate P1759 2.3 mm into chamber
# part REF-000062451 P464 (DSG-000000413) at home, an interference in the source CAD itself that
# the viewer still shows and the user was asked about.
- name: CAD home is clear
  positions: {}
  expect_clear: true
  allowed_pairs: [[P1751, P464], [P1759, P464]]
- name: Vertical lift contacts the outer cage
  positions:
    parker_lift_joint: -0.05
  touching_pairs: [[P558, P734]]
- name: Return from cage contact to home
  positions: {}
  expect_clear: true
  allowed_pairs: [[P1751, P464], [P1759, P464]]
# The ZA16A wedge follows ePix10k y, sticking 29 mm out of the stage's front at the top.
- name: ePix10k y top, wedge 29 mm out of the ZA16A front
  positions:
    detector_y_joint: 0.008
  expect_clear: true
  allowed_pairs: [[P1751, P464], [P1759, P464]]
- name: ePix10k y bottom, wedge drawn back
  positions:
    detector_y_joint: -0.008
  expect_clear: true
  # Lowered 8 mm, the dropped ePix10k also reaches the ePix100 breadboard DSG-000025045 P219
  # (frame P1751) and the top of P464 (mounting ribs P1475/P1476).
  allowed_pairs: [[P1751, P464], [P1759, P464], [P1751, P219], [P1475, P464], [P1476, P464]]
# Reviewed hull false positives that cannot close within travel. The convex hulls of chamber
# port P439 fill the bores the slit blade rods pass through; source CAD keeps clearance around
# each rod at every corner of its +/-4 mm y and +/-7.5 mm x travel.
ignored_pairs:
- pair: [P439, P103]
  reason: Bottom slit rod passes through the port bore with >= 2.786 mm CAD clearance over travel.
- pair: [P439, P149]
  reason: Top slit rod passes through the port bore with >= 2.729 mm CAD clearance over travel.
- pair: [P1138, P1138]
  reason: The ZA16A table and wedge are sibling bodies coupled by detector_y_wedge_joint; the
    1/4 incline keeps their drawn 0.5 mm roller clearance at every height, so no Drake joint
    filter covers this always-touching bearing.
- pair: [P1138, P1751]
  reason: ePix10k frame P1751 clears the ZA16A wedge by 8.787 mm at home and 0.787 mm at the bottom
    of +/-8 mm y travel, measured in CAD with the wedge sliding 4 mm per mm (1 mm steps).
# Mechanisms whose own drawn clearances are not faithful: every pair within a group is ignored,
# while each member stays checked against the rest of the assembly.
ignored_groups:
- parts: [P348, P349, P350, P351, P352, P353, P354, P355, P356, P357, P358, P359, P360, P361]
  reason: Newport M-EL80 lab jack LIB-000033108. Its pins stay seated over Newport's 53-113 mm, but
    the library CAD is drawn tighter than the real jack. At the drawn 112.2 mm the arms' sliding
    ends already cut 1.5 mm (36.5 mm3) into the plates' channels. Below 72.8 mm arm B sweeps into
    the top plate's underside beside its pivot, and the top block meets its channel end at 60.0 mm.
notes:
- Offline provisional kinematic model; CAD pose is q=0 for every joint.
- Axes and attachment order inferred from bearing geometry and coincident mounting planes.
- Catalog travel is exposed for review; imported Parker and Kohzu absolute travel zeros are uncalibrated.
- Kohzu XA/SA and Huber fused solids are partitioned at visible moving interfaces; internal bearings
  simplified.
- Bearing parts also list payloads riding a constant designed clearance to their own stage, which
  the inflated hulls fill. These are Huber end plate P968 (0.5 mm over +/-45 degrees), Parker
  bracket P730 (3.25 mm over +/-50 mm), slit lift brackets P117/P166 (0.787 mm over +/-4 mm) and
  slit X-stage sensor brackets P132/P181 (0.498 mm to the X carriage over +/-7.5 mm). Source-CAD
  gaps were checked across the full travel.
- The four crystal rotation stages LIB-000032444 (P799/P843/P886/P929) replaced the Kohzu RA04A-W
  in this revision and carry no solids in the STEP, so no rotation stage is drawn or checked. Each
  rotation axis rides the adapter mo39185433 above it, which kept its place in the stack; the XA07A
  translation stages sit 0.5 mm higher in each stack than before.
- The STEP holds four mo39154771 crystal stacks A071-A074. Stack 4 joint frames are stack 1 frames
  carried by the stack placement transform; the same transform reproduces stacks 2 and 3 to 0.022 mm.
- Jet stage parts are present in this STEP revision.
- Manual stages remain fixed, except the ePix100's M-EL80 lab jack, manual Kohzu translation and
  swivel. Beam construction geometry and communication configuration omitted.
- Analyzer (Huber 410) and crystal rotations are limited to +/-45 degrees about the CAD pose by
  request.
- Split outputs discard inverted and disconnected solids below 100 cubic millimetres; external stage
  bodies and carriage interfaces retained.
- Beamline axes, used to name the LJ, slit and detector joints, are y up (world +Z) and beam travelling
  along -z (world -Y), so z is world +Y and x is world -X. The beam direction is inferred from the
  slits upstream at world +Y and the ePix10k centred on world Y downstream.
- Liquid jet DSG-000007948 is a three-axis chain, as in the 43841 review. Kohzu XA05A-L202-R A007
  runs along the jet (x, 50 mm), XA05A-R202 A006 carries z (15 mm), then the ZA05A lift A005 carries
  y (+/-4 mm). The lift is at mid-travel in this STEP. Its carriage sits at the library's zero
  offset on its base, as both slit lifts do, and drops more than 5 mm before bottoming. The older
  43841 STEP drew every LIB-000032469 carriage 3.105 mm lower, so that review modelled the jet lift
  as fully down. The jet adapter DSG-000000506 P011 carries the long jet DSG-000022427 (A008 with
  DSG-000010732 A009), which left the design in the 2026-11-04 14:01 export and is back in the
  2026-11-12 export in place of jet holder DSG-000108486 and tube DSG-000005121; its parts ride the
  lift as in the 93ae4dc6 review.
- Bottom and top slits A011/A017 each stack a LIB-000032451 vertical lift (y, 8 mm) under an XA05A-R202
  (x, 15 mm); the blade rods ride the X stage. See auxiliary-stages.md.
- The slit blade holders DSG-000000720 (P537 bottom, P220 top) and their blade plates (P461/P462 bottom,
  P459/P460 top) are placed directly under chamber assembly A003 in the STEP, but are clamped by four
  5-40 screws to the tip of each blade rod (P103, P149). They ride the slit X stages.
- The ePix10k detector rides two Newport IMS300CC slides, the lower P1823 along z and the upper P1755
  along x. Each fused slide is split at its carriage, and 300 mm travel is assumed centred on the
  carriage position the fused slide models. The 2026-11-04 STEP moved everything on the lower
  carriage 80.1151 mm along world -Y; the 2026-11-12 STEP moves it back to its 93ae4dc6 place on the
  carriage, so no offset is needed and z runs +/-150 mm. Above the upper slide's adapter
  P1802, a Kohzu ZA16A-W2C01 wedge Z stage P1138 (the vendor's STEP, nine solids) lifts the detector
  along world +Z (y, +/-8 mm). Its table, solid 1, rides with everything above it from frame P1751
  up. Its 1/4 wedge, solids 6-7, slides under the table 4 mm along world +Y per mm of lift
  (detector_y_wedge_joint follows detector_y_joint), keeping the drawn 0.5 mm roller clearance to
  the table and base at every height and sticking 29 mm out of the stage's front at +8 mm, as in
  Kohzu's drawing. The base, feet and motor stay on the x slide. The vendor drawing gives the
  table 80 +/-8 mm above the mounting face, and the CAD table face sits at 80.0 mm, so the CAD pose
  is mid-travel.
- Outer cage A042 is fixed collision geometry. Large spectrometer controls are the two 100 mm Parker
  slides.
- The user-supplied controls envelope P734 and its support posts ride the Parker lift plate P698;
  this STEP revision replaces the earlier XCS Von Hamos Controls assembly DSG-000108873 with that
  single envelope.
- The supplied STEP is the 10 degree mounting configuration of DSG-000095826 on DSG-000097481. The
  0 and 5 degree mounting placements are not yet verified.
- Detector assembly LCL5005-008450 (ePix10k on two Newport IMS300 slides) keeps its parts at least
  100 mm across, including front plate mo39134025 P1374; smaller parts and electronics are omitted.
- Diffractometer base P1005 is fixed geometry. The diffractometer body, 2-theta arm and 2-theta stage
  (P1006-P1008) carry only coordinate systems in this STEP, so no further diffractometer geometry can
  be shown; its goniometer SA-391-444-50 is not in the export. The rest of table assembly
  DSG-000008836 (understructure, floor anchors) stays omitted.
- Camera rotation stage LIB-000032933 (P497 base, P498 top) has geometry since the 2026-11-12 export
  and is held fixed with the camera mount; LIB-000032929 still has no solids.
- The upward-facing ePix100 (module mo39154223 in DSG-000042618 A023) rides, from the fixed block
  P229, a manual Newport M-EL80 lab jack LIB-000033108 A035 along world +Z (y), a Micronix
  VT-50L-13316 stepper stage LIB-000033066 A025 along world X, a manual stage LIB-000033109 A036 along
  world Y, and a Kohzu SH05B-RM manual swivel LIB-000013709 A024 about world X through datum sphere
  P246, where the swivel base's guideway arcs are centred. Its top plate's arcs sit 0.30 mm lower, a
  small mating offset in the CAD left as drawn. A 10 degree wedge adapter P222 under the swivel gives
  the detector's CAD tilt; the swivel itself is centred. The module's front/rear covers P312/P268
  and cooling block P295/P296 are retained with the external coolant fittings and tubes
  P297-P304/P334 and the transceiver P286 and ribbon cable P293 that protrude from the rear face; the
  parts fully enclosed by the covers stay omitted as internals.
- The M-EL80 is a single scissor drawn 112.21 mm high, near its 113 mm maximum. Arm A P350 pins to
  the base plate P349 at (x -233.969, z -217.074) mm and slides on top block P353; arm B P351 pins to
  the top plate P348 at z -130.963 and slides on bottom block P354; they cross at centre pin P355.
  The arms are 103.581 mm between pivots, at 56.24 degrees. Knob and screw P352 ride the top plate
  and drive P353 as a nut. epix100_y_joint lifts the top plate; the arms and blocks follow it by the
  exact scissor relation. ePix100 y covers Newport's full 53-113 mm, -59.211/+0.789 mm about the CAD
  pose, as the user asked; the jack is drawn near the top of its travel. The library CAD is drawn
  tighter than the real jack (see ignored_groups), so its own parts visibly overlap low in the
  stroke.
- The VT-50L-13316 is Micronix's 198 mm version. Its carriage P249 runs 175.5 mm towards the motor,
  where its nut housing meets the motor mount, and 28.0 mm to the far end block, 203.5 mm in all. The
  198 mm between its limit switches is assumed centred in that, so the carriage is drawn 73.8 mm
  from mid-travel and ePix100 x runs -25.22/+172.78 mm along beamline x (world -X).
- The manual stage LIB-000033109 (base P365, table P366, micrometer P367 along world +Y) replaces
  the earlier fused Kohzu model; its CAD has no end stops, so it keeps that stage's +/-6.5 mm.
