# Newport IMS300CC: local Z is travel; the carriage top plate spans Z -100..82 above Y 76.
# A recipe entry can add moving_offset_mm when the STEP places the payload elsewhere.
IMS300CC:
  source_solids:
  - 1
  moving_mask:
    kind: box
    min_mm: [-100, 76, -100]
    max_mm: [100, 95, 82]
# ePix100 lead-screw linear stage LIB-000000725, fused into one solid. Local Z is travel.
# The carriage plate, guide block, right-side flag skirt and hex drive nut move; the
# channel, guide rail, lead screw (r 3.17 at X -2.55, Y 10.2), end blocks and motor stay.
LIB-000000725:
  source_solids:
  - 1
  moving_mask:
    kind: difference
    operands:
    - kind: union
      operands:
      - {kind: box, min_mm: [-27.3, 6.8, 77.5], max_mm: [35.8, 16.8, 133.6]}
      - {kind: box, min_mm: [-23.1, -4.1, 77.5], max_mm: [-15.05, 6.9, 133.6]}
      - {kind: box, min_mm: [9.05, -4.1, 77.5], max_mm: [17.45, 6.9, 133.6]}
      - {kind: box, min_mm: [-15.05, 1.05, 77.5], max_mm: [9.05, 6.9, 133.6]}
      - {kind: box, min_mm: [17.45, 5.55, 77.5], max_mm: [25.05, 6.9, 133.6]}
      - {kind: box, min_mm: [25.05, -6.0, 77.5], max_mm: [35.8, 6.9, 133.6]}
      - {kind: box, min_mm: [-15.3, 3.9, 56.0], max_mm: [10.3, 16.7, 77.6]}
    - {kind: cylinder, origin_mm: [-2.55, 10.2, 50.0], axis_xyz: [0, 0, 1], radius_mm: 3.3,
