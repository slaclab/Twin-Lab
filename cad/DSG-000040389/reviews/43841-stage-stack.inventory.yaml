# Editable logical operating limits and home positions. Angular values here are
# degrees; A048/A053 use the assembly's 180-degree mounting orientation as home.
joint_limit_overrides:
  A040: {unit: meter, limits: [-0.400, 0.0], home: 0.0}  # EPIX CAD pose is upper endpoint
  # The jet lift is assembled fully down, so its 8 mm travel runs one way from the CAD
  # pose. Home is the bottom of that travel, which is the CAD pose itself.
  A004: {unit: meter, limits: [0.0, 0.008], home: 0.0, cad_position: 0.0}
  A044: {unit: degree, limits: [-10, 10]}
  # The Middle Crystal is drawn 155 degrees away from the orientation that reflects its
  # beam onto the EPIX: at the CAD pose the reflection misses the detector by 471 mm,
  # and at 155 degrees by 22 mm. The optimum is sharp - 150 and 160 degrees miss by 87
  # and 101 mm - so this is a real solution rather than a flat region. RA04A-W01 travels
  # +/-177 degrees, so the rotation is within the stage. `cad_position: 0` is what makes
  # this move the geometry; without it the home would only relabel the CAD pose.
  A045: {unit: degree, limits: [125, 185], home: 155, cad_position: 0}
  A047: {unit: degree, limits: [-10, 10]}
  A048: {unit: degree, limits: [150, 210], home: 180}
  A052: {unit: degree, limits: [-10, 10]}
  A053: {unit: degree, limits: [150, 210], home: 180}

