# Editable logical operating limits and home positions. Angular values here are
# degrees; A049/A054 use the assembly's 180-degree mounting orientation as home.
joint_limit_overrides:
  A041: {unit: meter, limits: [-0.400, 0.0], home: 0.0}  # EPIX CAD pose is upper endpoint
  # The jet lift is assembled fully down, so its 8 mm travel runs one way from the CAD
  # pose. Home is the bottom of that travel, which is the CAD pose itself.
  A005: {unit: meter, limits: [0.0, 0.008], home: 0.0, cad_position: 0.0}
  A045: {unit: degree, limits: [-10, 10]}
  A046: {unit: degree, limits: [-30, 30]}
  A048: {unit: degree, limits: [-10, 10]}
  A049: {unit: degree, limits: [150, 210], home: 180}
  A053: {unit: degree, limits: [-10, 10]}
  A054: {unit: degree, limits: [150, 210], home: 180}

# Human-reviewed exceptions always override automatic proximity grouping.
hidden_occurrences:
