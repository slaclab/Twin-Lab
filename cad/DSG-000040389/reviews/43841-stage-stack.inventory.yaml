# Line-of-sight beams: out of each collimating optic, off its Bragg crystal face,
# stopping at the first part met. `ignore` lets a beam leave its own mount; `expected`
# marks the parts it is meant to land on, so stopping there is not an obstruction.
# Refs remapped to the 2026-09-24 STEP.
#
# The crystal itself is not separately identifiable in this CAD. Each `crystal.ref`
# is the holder, whose topmost face normal to local +z is the lip the crystal seats
# in; that lip's proud face is flush with the crystal surface (reviewed 2026-09-27),
# so it is the diffracting plane with no normal offset applied. The face reads as a
# 28 mm circle; its normal comes from the part transform, not the tessellation, so
# mesh deflection does not enter the reflected angle.
beam_paths:
  - name: South
    diameter_mm: 20.0
    subdivisions: 1
    source:
      ref: P2654                                   # REF-000221282 collimating optic
      mesh: attached_A224_polycap_and_holder.obj
      ignore: [P2655, P2669, P2690, P2696]         # optic body, KM and its adapters
    crystal:
      ref: P2577                                   # DSG-000042292 Bragg xtal holder clip
      mesh: attached_A218_crystal_and_holder.obj
      ignore: [P2579, P2638]                       # 42294 adapter and 27467 holder
    expected: [P2578, P2388]                       # South annular PIPS diode, EPIX 100P
  - name: Middle
    diameter_mm: 20.0
    subdivisions: 1
    source:
      ref: P2721                                   # REF-000221282 collimating optic
      mesh: attached_A227_polycap_and_holder.obj
      ignore: [P2722, P2725, P2726, P2727]         # optic body, KM and its adapters
    crystal:
      ref: P2507                                   # DSG-000041271 Bragg xtal holder clip
      mesh: attached_A210_crystal_and_holder.obj
      ignore: [P2508, P2509]                       # 27467 holder and 42294 adapter
    expected: [P2504, P2388]                       # Middle annular PIPS diode, EPIX 100P
  - name: North
    diameter_mm: 20.0
    subdivisions: 1
    source:
      ref: P2782                                   # REF-000221282 collimating optic
      mesh: attached_A233_polycap_and_holder.obj
      ignore: [P2783, P2805, P2807, P2818]         # optic body, KM and its adapters
    crystal:
      ref: P2511                                   # DSG-000041271 Bragg xtal holder clip
      mesh: attached_A213_crystal_and_holder.obj
      ignore: [P2512, P2527]                       # 42294 adapter and 27467 holder
    expected: [P2513, P2388]                       # North annular PIPS diode, EPIX 100P

