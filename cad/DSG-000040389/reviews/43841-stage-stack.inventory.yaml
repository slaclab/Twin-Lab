# Part pairs that clearance reports should not flag. Drake already filters bodies
# joined by a joint and bodies welded into one subgraph, so this is only for parts
# that touch by design across otherwise independent bodies. Populate from a review
# of the home-pose report; every entry needs a reason.
# Baselined from the home-pose report: the reviewed CAD home is an assembled state,
# so contact there is pre-existing, not an interference produced by motion. Depths
# are 0.5-2.7 mm. NOT yet individually validated as by-design; re-review if a stack
# is re-modelled.
ignored_pairs:
