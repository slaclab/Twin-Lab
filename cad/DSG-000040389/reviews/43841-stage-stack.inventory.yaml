# Reviewed base-to-payload order for the detector and three crystal stacks.
motion_chains:
  Detector: [A041]
  North Crystal: [A051, A050, A049, A048]
  Middle Crystal: [A044, A043, A046, A045]
  South Crystal: [A056, A055, A054, A053]
  # Base to payload: 50 mm linear, 15 mm transverse, 8 mm lift, then the adapter and
  # the long jet. Travel directions come from the stage frames, not from the assembly
  # axes: A007 drives along DSG-000102548 Y (the jet's own axis), A006 along X, A005
  # along Z. Each stage's own rail confirms it - A006 has only 5 mm of clearance in Y
  # and needs 15 mm, so it cannot be the Y axis.
  Long Jet: [A007, A006, A005]

