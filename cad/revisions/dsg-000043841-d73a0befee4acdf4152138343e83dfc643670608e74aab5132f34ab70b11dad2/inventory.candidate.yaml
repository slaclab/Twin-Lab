  - pair: [P235, P304]
    reason: fixed detector-tower base plate P235 is mounted to the A030 lifting-stage bracket P304
  - pair: [P1100, P3089]
    reason: touching at reviewed CAD home (-2.69 mm)
  - pair: [P1057, P3089]
    reason: touching at reviewed CAD home (-2.37 mm)
  - pair: [P1099, P3089]
    reason: touching at reviewed CAD home (-2.10 mm)
  - pair: [P1063, P3089]
    reason: touching at reviewed CAD home (-1.59 mm)
  # RE-REVIEW: P064 is no longer static. It rides the long-jet lift now, so this pair can
