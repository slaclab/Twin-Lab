[build-system]
# 77 is where setuptools accepts the PEP 639 SPDX license string below.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-lab"
version = "0.1.0"
description = "Stage-stack models for SLAC X-ray spectrometers."
readme = "README.md"
# Floor is set by drake, which dropped 3.10/3.11 wheels at 1.52.
requires-python = ">=3.12,<3.15"
license = "BSD-3-Clause-LBNL"
license-files = ["LICENSE.txt"]
authors = [
    {name = "SLAC"},
]
keywords = ["robotics", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "cadquery-ocp-stubs>=7.9.3.1.1",
    "pytest>=8.0",
    "ruff>=0.12",
]
cad = [
    "cadquery-ocp>=7.8",
    "pyyaml>=6.0",
]
drake = [
    "drake>=1.54",
]
collision = [
    "coacd>=1.0",
    "numpy>=1.26",
]

[project.scripts]
slac-cad-manifest = "twin_lab.constraints_wizard:main"
slac-stage-cad = "twin_lab.stage_cad_viewer:main"
slac-compile-sdf = "twin_lab.sdf_compiler:main"
slac-collision = "twin_lab.collision_viewer:main"
slac-decompose = "twin_lab.convex_collision:main"
slac-hull-audit = "twin_lab.hull_audit:main"
slac-view = "twin_lab.scene:main"
slac-refresh-43841 = "twin_lab.update_43841_step:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
twin_lab = ["assets/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
