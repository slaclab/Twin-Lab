[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slac-robotics-framework"
version = "0.1.0"
description = "SLAC Robotics Framework"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [
    {name = "SLAC"},
]
keywords = ["robotics", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]
cad = [
    "cadquery-ocp>=7.8",
    "pyyaml>=6.0",
]
drake = [
    "drake>=1.54",
]

[project.scripts]
slac-cad-manifest = "slac_robotics.constraints_wizard:main"
slac-stage-cad = "slac_robotics.stage_cad_viewer:main"
slac-compile-sdf = "slac_robotics.sdf_compiler:main"
slac-collision = "slac_robotics.collision_viewer:main"
slac-decompose = "slac_robotics.convex_collision:main"
slac-view = "slac_robotics.scene:main"
slac-refresh-43841 = "slac_robotics.update_43841_step:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
